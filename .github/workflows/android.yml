name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: mobile-android
        env:
          API_BASE_URL: ${{ vars.DIARIO_API_BASE_URL }}
        run: |
          BASE="${API_BASE_URL:-https://SEU-DOMINIO.example/}"
          gradle :app:assembleDebug -PDIARIO_API_BASE_URL="$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: diario-escolar-pro-debug-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
