plugins { id 'com.android.application' }

android {
    namespace 'br.com.diarioescolarpro'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.diarioescolarpro'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '2.0.0'
        def apiUrl = project.findProperty('DIARIO_API_BASE_URL') ?: 'https://SEU-DOMINIO.example/'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl.toString().replace('"','\\"') + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
