services:
  - type: web
    name: diario-escolar-pro
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-2} --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: PRODUCTION
        value: "True"
      - key: DJANGO_REQUIRE_DATABASE_URL
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GESTAO_AUTORIZACAO_EMAIL
        sync: false
      - key: GESTAO_LICENCA_CONTATO_WHATSAPP
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Diário Escolar Pro"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
